name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  notebook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt ruff
      - name: Download the corpus
        run: python -m nltk.downloader movie_reviews stopwords punkt_tab vader_lexicon
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q
      - name: Run the notebook top to bottom
        # executes into a copy, so a cell that errors fails the build
        run: jupyter nbconvert --to notebook --execute sentiment_analysis.ipynb --output /tmp/executed.ipynb
